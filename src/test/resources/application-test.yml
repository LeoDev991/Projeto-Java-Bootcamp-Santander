spring:
  datasource:
    url: jdbc:h2:mem:senior-commerce-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

security:
  jwt:
    issuer: senior-commerce-api-test
    secret: "test-secret-test-secret-test-secret-test-secret"
    expiration-minutes: 30

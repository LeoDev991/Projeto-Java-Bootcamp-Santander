spring:
  application:
    name: senior-commerce-api
  datasource:
    url: jdbc:postgresql://localhost:5432/senior_commerce
    username: commerce
    password: commerce
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

security:
  jwt:
    issuer: senior-commerce-api
    secret: "change-this-secret-in-production-change-this-secret"
    expiration-minutes: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.portfolio.commerce: INFO
    org.springframework.security: INFO

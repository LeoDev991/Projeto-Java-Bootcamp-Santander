services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: senior_commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d senior_commerce"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
